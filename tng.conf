# ======================================
# Config example:
# * tng config syntax rules
# * For variable with bool type you can use <YES> or <NO> instead of
#  <true> or <false>.
# * You can't use non-absolute path for addressing path.
# * Use """ for more then one line string.
# ======================================

# Define section
		[cpp, c, cc, hpp, h]

# ======================================
# Policy
# ======================================

comment = YES
comment_style = block
# comment_style -> can be 'block' or 'line'

# First we have to define buffer behave setup.
# - Did the output buffer have to be commented? so we define 'comment', 'YES'.
# - What have to be comment style, 'block' based or 'line' based? We define block


# Each element of comment for multi-line comment or liner comment
# In this example we have
#
#	// Line
#
#	/*
#	 * Non-liner or Block comment
#	 */
# 
line_prefix = "//"
block_header = "/*"
block_line_prefix = " * "
block_footer = " */"

# Include license file in project
include_license = YES

# Locate license path
license_path = "/home/exampleUserName/license-file/"
# TODO: use PWD in here
# -> license_path = "PWD/license/"

# Pre configed
include_license_before_header = YES
space_between_header_footer = 4
overwrite_existing_file = NO # tng defualt in no 


# ======================================
# Layout
# ======================================

header_text = """
